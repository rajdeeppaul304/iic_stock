<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>+++ADMIN++</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <section class="w-full flex justify-center bg-[#111827] h-12 m-0 p-0">
        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" id="serverCheckbox" value="" class="sr-only peer" {% if ServerStartStop %}checked{% endif %}>
            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Start Server</span>
        </label>
    </section>
    <section>
        <form id="stockForm" class="bg-[#111827] relative block justify-left p-2 px-8 space-y-4 md:space-y-0 md:space-x-4 md:flex">
            <div class="relative md:w-4/12">
                <select id="stockSelect" class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
                    <option value="">Choose an option</option>
                    {% for key, stock in stocks_data.items() %}
                    <option value="{{key}}">{{stock.name}}</option>
                    {% endfor %}
                </select>
                <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                    <svg class="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M10 12L6 8h8l-4 4z"/></svg>
                </div>
            </div>
            <div class="md:w-4/12">
                <div class="relative">
                    <input id="quantityInput" type="number" class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500" placeholder="Enter a number">
                </div>
            </div>
            <div class="md:w-4/12 flex justify-end">
                <button type="submit" class="bg-blue-500 hover:bg-blue-700 text-white h-full w-full md:w-auto font-bold py-2 px-4 rounded">
                    Update Stock Value
                </button>
            </div>
        </form>
        
        


          
    </section>

    <script>
        document.getElementById('stockForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Prevent default form submission
            
            // Get selected option value and input value
            const selectedOption = document.getElementById('stockSelect').value;
            const inputValue = document.getElementById('quantityInput').value;
            
            // Check if "Choose an option" is selected
            if (selectedOption === '') {
                alert('Please choose an option.');
                return;
            }

            if (inputValue === '' || isNaN(inputValue)) {
            alert('Please type a valid number.');
            return;
        }
            
            // Send form data to server
            fetch('/stock_submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    option: selectedOption,
                    quantity: inputValue
                })
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }
                // Optionally, you can handle the response here
                console.log('Form submitted successfully');
            })
            .catch(error => {
                console.error('Error:', error);
                // Optionally, you can handle the error here
            });
    
            // Reset the form
            this.reset();
        });
    </script>
    


    <script>
        document.getElementById('serverCheckbox').addEventListener('change', function() {
            const serverState = this.checked;
            fetch('/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ ServerStartStop: serverState })
            })
            .then(response => response.json())
            .then(data => console.log('Success:', data))
            .catch((error) => {
                console.error('Error:', error);
            });
        });
    </script>

</body>


</html>
