{% extends 'layout.html' %}

{% block content %}

<style>
  #qr-reader a {
    font-size: 18px;
    color: #007BFF;
    /* Bright blue */
    text-decoration: none;
    /* Removes underline */
    padding: 10px 15px;
    display: inline-block;
    /* Allows padding and width/height */
    cursor: pointer;
    margin-top: 2px;

  }

  #qr-reader button {
    padding: 10px 20px;
    font-size: 16px;
    color: #FFFFFF;
    background-color: #4CAF50;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    outline: none;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    margin-top: 2px;
  }
</style>
<div class="flex flex-col items-center justify-center h-full md:min-h-screen pt-10 md:pt-0 overflow-hidden ">
  <div class="border border-green-600 flex flex-col items-center justify-center w-10/12 md:w-5/12">
    <div id="qr-reader" class="w-full border border-green-600"></div>
    <div id="qr-reader-results" class="border border-green-600"></div>
  </div>

</div>



<form action="" id="form-for-barter" class="text-white">
  <div>
    <h1 class="text-3xl font-bold mb-8 text-center pt-5">Or input it Manually</h1>
    <div class=" flex justify-center">
      <div class="w-11/12">
        <input type="text" name="manual-input-qr" id="manual-input-qr" aria-describedby="manual-input-qr-explanation"
          class=" bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-blue-500 focus:border-blue-500 block w-full p-2.5  "
          placeholder="input code from friend..." required>
      </div>
    </div>
  </div>
  <div class="text-center text-2xl pt-5">
    Stock to Give
  </div>
  <div class="flex justify-between">
    <div class="relative p-4 w-7/12 md:w-4/12">
      <select id="stockSelect" name="give-selected-stock"
        class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
        <option value="NoValue">Choose an option</option>

        {% for key, stock in current_user_stocks.items() %}

        <option value="{{key}}">{{stocks_data[key]['name']}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="w-5/12 md:w-4/12 p-4">
      <div class="relative">
        <input id="quantityInput" type="number" name="give-value-stock"
          class="block prevent-negative-value appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          placeholder="Value">
      </div>
    </div>
  </div>
  <div class="text-center text-2xl pt-5">
    Stock to Take
  </div>
  <div class="flex justify-between">
    <div class="relative p-4 w-7/12 md:w-4/12">
      <select id="stockSelect2" name="take-selected-stock"
        class="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500">
        <option value="NoValue">Choose an option</option>
        {% for key, stock in stocks_data.items() %}
        <option value="{{key}}">{{stock.name}}</option>
        {% endfor %}
      </select>
    </div>
    <div class="w-5/12 md:w-4/12 p-4">
      <div class="relative">
        <input id="quantityInput2" type="number" name="take-value-stock"
          class="block prevent-negative-value appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          placeholder="Value">
      </div>
    </div>
  </div>
  <!-- Radio buttons -->


  <div class="flex justify-center">
    <div class="w-10/12 md:w-7/12">
      <ul
        class="items-center w-full text-sm font-medium text-gray-900 bg-white border border-gray-200 rounded-lg sm:flex ">
        <li class="w-full border-b border-gray-200 sm:border-b-0 sm:border-r ">
          <div class="flex items-center ps-3">
            <input id="horizontal-list-radio-bartnorm" type="radio" value="bartnorm" name="list-radio"
              onchange="handleRadioChange()"
              class="w-4 h-4 text-violet-600 focus:ring-violet-500  bg-gray-100 border-gray-300 focus:ring-2 " checked>
            <label for="horizontal-list-radio-bartnorm"
              class="w-full py-3 ms-2 text-sm font-medium text-gray-900 ">Barter Normally</label>
          </div>
        </li>
        <li class="w-full border-b border-gray-200 sm:border-b-0 sm:border-r ">
          <div class="flex items-center ps-3">
            <input id="horizontal-list-radio-give" type="radio" value="give-bart" name="list-radio"
              onchange="handleRadioChange()"
              class="w-4 h-4 text-violet-600 focus:ring-violet-500  bg-gray-100 border-gray-300 focus:ring-2">
            <label for="horizontal-list-radio-give" class="w-full py-3 ms-2 text-sm font-medium text-gray-900 ">Give
              money and stock both</label>
          </div>
        </li>
        <li class="w-full border-b border-gray-200 sm:border-b-0 sm:border-r ">
          <div class="flex items-center ps-3">
            <input id="horizontal-list-radio-take" type="radio" value="take-bart" name="list-radio"
              onchange="handleRadioChange()"
              class="w-4 h-4 text-violet-600 focus:ring-violet-500 600 bg-gray-100 border-gray-300 focus:ring-2 ">
            <label for="horizontal-list-radio-take" class="w-full py-3 ms-2 text-sm font-medium text-gray-900 ">Take
              money and stock both</label>
          </div>
        </li>
      </ul>
    </div>
  </div>
  <div class="flex justify-center ">
    <div class="w-10/12 md:w-4/12 p-4">
      <div class="relative">
        <input id="quantityInput3" type="number" name="money-barter-stock"
          class="block appearance-none w-full prevent-negative-value bg-white border border-gray-300 text-gray-700 py-3 px-4 rounded leading-tight focus:outline-none focus:bg-white focus:border-gray-500"
          placeholder="Amount To give/take">
      </div>
    </div>
  </div>


  <div class="flex justify-center mb-6">
    <button type="submit"
      class="submitButton px-4 py-2 w-9/12 md:w-3/12 text-affirmationFgColor bg-affirmationBgColor hover:bg-affirmationBgHoverColor focus:ring-4 focus:ring-affirmationFocusRingColor rounded-md focus:outline-none ">Send
      Trade request
    </button>
  </div>
</form>

<script>
  function showError(message) {
    var modal = document.getElementById('errorModal');
    var errorMessage = modal.querySelector('.errorMessage-text');
    modal.classList.remove('hidden');
    modal.classList.add('visible');
    errorMessage.textContent = message;
    document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open
  }
  function showSuccess(message) {
    var modal = document.getElementById('successModal');
    var successMessage = modal.querySelector('.successMessage-text');
    modal.classList.remove('hidden');
    modal.classList.add('visible');
    successMessage.textContent = message;
    document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open
  }
  function hideError() {
    document.getElementById('errorModal').classList.remove('visible');
    document.getElementById('errorModal').classList.add('hidden');
    document.body.style.overflow = ''; // Restore scrolling when modal is closed
  }
  function hideSuccess() {
    document.getElementById('successModal').classList.remove('visible');
    document.getElementById('successModal').classList.add('hidden');
    document.body.style.overflow = ''; // Restore scrolling when modal is closed
  }
  document.getElementById('closeErrorButton').addEventListener('click', hideError);
  document.getElementById('closeSuccessButton').addEventListener('click', hideSuccess);
</script>

<script>
  function handleRadioChange() {
    // var input1 = document.getElementById("quantityInput");

    // var input2 = document.getElementById("quantityInput2");
    // var input2_ = document.getElementById("stockSelect2");

    var input3 = document.getElementById("quantityInput3");

    var option1 = document.getElementById("horizontal-list-radio-bartnorm");
    var option2 = document.getElementById("horizontal-list-radio-take");
    var option3 = document.getElementById("horizontal-list-radio-give");

    if (option1.checked) {
      input3.disabled = true;

    } else if (option2.checked) {
      input3.disabled = false;

    } else if (option3.checked) {
      input3.disabled = false;

    }
  }
  handleRadioChange()
</script>

<script>
  // Function to handle QR code 


  var resultContainer = document.getElementById('qr-reader-results');
  var lastResult, countResults = 0;

  function onScanSuccess(decodedText, decodedResult) {
    if (decodedText !== lastResult) {
      ++countResults;
      lastResult = decodedText;
      // Handle on success condition with the decoded message.
      alert(`Scan result ${decodedText} ${decodedResult}`)
      document.getElementById('manual-input-qr').value = decodedText;

      console.log(`Scan result ${decodedText}`, decodedResult);
    }
  }

  var html5QrcodeScanner = new Html5QrcodeScanner(
    "qr-reader", { fps: 10, qrbox: 250 });
  html5QrcodeScanner.render(onScanSuccess);

</script>
