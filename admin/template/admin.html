<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>+++ADMIN++</title>
    <script src="https://cdn.tailwindcss.com"></script>

</head>
<body>
    <section class="w-full flex justify-center bg-[#111827] h-12 m-0 p-0">
        <label class="inline-flex items-center cursor-pointer">
            <input type="checkbox" id="serverCheckbox" value="" class="sr-only peer" {% if ServerStartStop %}checked{% endif %}>
            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-gray-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
            <span class="ms-3 text-sm font-medium text-gray-900 dark:text-gray-300">Start Server</span>
        </label>
    </section>
    <script>
        document.getElementById('serverCheckbox').addEventListener('change', function() {
            const serverState = this.checked;
            fetch('/admin', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ ServerStartStop: serverState })
            })
            .then(response => response.json())
            .then(data => console.log('Success:', data))
            .catch((error) => {
                console.error('Error:', error);
            });
        });
    </script>
</body>


</html>
