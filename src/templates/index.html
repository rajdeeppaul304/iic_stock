<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INDEX</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.css" rel="stylesheet" />
</head>

<body>
    <nav class="bg-gray-800 text-white p-4">
        <div class="container mx-auto flex items-center justify-between">
            <div class="flex items-center">
                <span class="font-semibold text-xl tracking-tight">IIC</span>
            </div>
            <div class="hidden md:flex space-x-4">
                <a href="#" class="hover:bg-gray-700 px-4 py-2 rounded-md">{{name}}</a>
                <a href="#" class="hover:bg-gray-700 px-3 py-2 rounded-md">Current Balance: {{current_balance}}</a>
                <a href="#" class="hover:bg-gray-700 px-3 py-2 rounded-md">notification</a>
            </div>
            <!-- Mobile menu button -->
            <button class="md:hidden block text-gray-500 hover:text-white focus:text-white focus:outline-none">
                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                </svg>
            </button>
        </div>
    </nav>





    <section>
        <div class="w-full flex justify-center">
            <div class="container mt-5 mb-3 w-11/12">
                <!-- Search Bar -->
                <!-- <input class="w-full my-4 h-10" type="text" id="searchInput" placeholder="Search Stocks by name..."> -->
                <div class="w-full my-4 md:my-4 md:px-20">
                    <div class="relative w-full min-w-[200px] h-10">
                        <div
                            class="absolute grid w-5 h-5 place-items-center text-blue-gray-500 top-2/4 right-3 -translate-y-2/4">
                            <!-- <i class="fas fa-heart" ></i> -->
                            <img src="{{ url_for('static', filename='images/search.svg') }}" alt="Search Icon">

                        </div>
                        <input id="searchInput"
                            class="peer w-full h-full bg-transparent text-blue-gray-700 font-sans font-normal outline outline-0 focus:outline-0 disabled:bg-blue-gray-50 disabled:border-0 transition-all placeholder-shown:border placeholder-shown:border-blue-gray-200 placeholder-shown:border-t-blue-gray-200 border focus:border-2 border-t-transparent focus:border-t-transparent text-sm px-3 py-2.5 rounded-[7px] border-blue-gray-200 focus:border-blue-500"
                            placeholder=" " /><label
                            class="flex w-full h-full select-none pointer-events-none absolute left-0 font-normal !overflow-visible truncate peer-placeholder-shown:text-blue-gray-500 leading-tight peer-focus:leading-tight peer-disabled:text-transparent peer-disabled:peer-placeholder-shown:text-blue-gray-500 transition-all -top-1.5 peer-placeholder-shown:text-sm text-[11px] peer-focus:text-[11px] before:content[' '] before:block before:box-border before:w-2.5 before:h-1.5 before:mt-[6.5px] before:mr-1 peer-placeholder-shown:before:border-transparent before:rounded-tl-md before:border-t peer-focus:before:border-t-2 before:border-l peer-focus:before:border-l-2 before:pointer-events-none before:transition-all peer-disabled:before:border-transparent after:content[' '] after:block after:flex-grow after:box-border after:w-2.5 after:h-1.5 after:mt-[6.5px] after:ml-1 peer-placeholder-shown:after:border-transparent after:rounded-tr-md after:border-t peer-focus:after:border-t-2 after:border-r peer-focus:after:border-r-2 after:pointer-events-none after:transition-all peer-disabled:after:border-transparent peer-placeholder-shown:leading-[3.75] text-blue-gray-400 peer-focus:text-blue-500 before:border-blue-gray-200 peer-focus:before:!border-blue-500 after:border-blue-gray-200 peer-focus:after:!border-blue-500">Search
                            For Stocks
                        </label>
                    </div>
                </div>


                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 " id="itemsContainer">
                    {% for item in items %}
                    <div class="items-class rounded-md overflow-hidden bg-blue-200">
                        <div class="flex justify-center bg-blue-200 p-4 ">
                            <div class="font-bold item-head">{{ item }}</div>
                        </div>
                        <div class="flex bg-blue-200 px-4 ">
                            <div class="font-bold item-head">Nvidea corp</div>
                        </div>
                        <div class="flex bg-blue-200 px-4 justify-end">
                            <div class="font-bold item-head rounded-md bg-red-300 px-2">IT</div>
                        </div>
                        <div class="bg-blue-200 p-4">Lorem ipsum dolor sit amet consectetur adipisicing elit. Libero,
                            quos!</div>
                        <div class="flex bg-blue-200 p-4 justify-center mb-2">

                            <div class="custom-number-input h-10 w-32">

                                <div class="flex flex-row h-10 w-full rounded-lg relative bg-transparent mt-1">
                                    <button data-action="decrement"
                                        class=" bg-[#fee2bf] text-gray-600 hover:text-[#fff] hover:bg-[#e2bffe]  h-full w-20 rounded-l cursor-pointer ">
                                        <span class="m-auto text-2xl font-thin">−</span>
                                    </button>
                                    <input type="number" id="item-{{ loop.index0 }}"
                                        class="stock-amount border-0 focus:border-0 focus:ring-0 text-center w-full bg-[#fee2bf] text-gray-600 hover:text-[#fff] font-semibold text-md hover:text-black focus:text-black  md:text-basecursor-default flex items-center text-gray-700 "
                                        name="custom-input-number" value="0"></input>
                                    <button data-action="increment"
                                        class="bg-[#fee2bf] text-gray-600 hover:text-[#fff] hover:bg-[#e2bffe] h-full w-20 rounded-r cursor-pointer">
                                        <span class="m-auto text-2xl font-thin">+</span>
                                    </button>
                                </div>
                            </div>




                        </div>


                        <div class="flex bg-blue-200 p-4 justify-between">
                            <div>
                                <button type="button" name="buy" value=`{{item}}` id="buy-{{ loop.index0 }}"
                                    class="btn-confirm focus:outline-none text-white bg-green-700 hover:bg-green-800 focus:ring-4 focus:ring-green-300 font-medium rounded-lg text-sm px-3 md:px-5 py-2.5 me-1 mb-2 dark:bg-[#08a045] dark:hover:bg-[#ob6e4f] dark:focus:ring-green-800">BUY</button>
                            </div>
                            <div>
                                <button type="button" name="sell" value=`{{item}}` id="sell-{{ loop.index0 }}"
                                    class=" btn-confirm focus:outline-none text-white bg-red-400 hover:bg-red-800 focus:ring-4 focus:ring-red-300 font-medium rounded-lg text-sm px-3 md:px-5 py-2.5 me-1 mb-2 dark:bg-red-500 dark:hover:bg-red-700 dark:focus:ring-red-900">SELL</button>
                            </div>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </section>


    <div id="confirmationModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>
            <!-- This element is to trick the browser into centering the modal contents. -->
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <!-- Confirmation Dialog -->
            <div
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="modal-title">
                                Confirmation
                            </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500 confirmation-text">
                                    Are you sure you want to delete this item?
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="confirmButton" type="button"
                        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Yes
                    </button>
                    <button id="cancelButton" type="button"
                        class="mt-3 w-full inline-flex justify-center rounded-md border border-gray-300 shadow-sm px-4 py-2 bg-white text-base font-medium text-gray-700 hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 sm:mt-0 sm:ml-3 sm:w-auto sm:text-sm">
                        Cancel
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="errorModal" class="fixed z-10 inset-0 overflow-y-auto hidden">
        <div class="flex items-end justify-center min-h-screen pt-4 px-4 pb-20 text-center sm:block sm:p-0">
            <div class="fixed inset-0 transition-opacity" aria-hidden="true">
                <div class="absolute inset-0 bg-gray-500 opacity-75"></div>
            </div>
            <!-- This element is to trick the browser into centering the modal contents. -->
            <span class="hidden sm:inline-block sm:align-middle sm:h-screen" aria-hidden="true">&#8203;</span>
            <!-- Confirmation Dialog -->
            <div
                class="inline-block align-bottom bg-white rounded-lg text-left overflow-hidden shadow-xl transform transition-all sm:my-8 sm:align-middle sm:max-w-lg sm:w-full">
                <div class="bg-white px-4 pt-5 pb-4 sm:p-6 sm:pb-4">
                    <div class="sm:flex sm:items-start">
                        <div class="mt-3 text-center sm:mt-0 sm:text-left">
                            <h3 class="text-lg leading-6 font-medium text-gray-900" id="error-modal-title">
                                Error
                            </h3>
                            <div class="mt-2">
                                <p class="text-sm text-gray-500 confirmation-text">
                                    please Enter a Valid amount.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bg-gray-50 px-4 py-3 sm:px-6 sm:flex sm:flex-row-reverse">
                    <button id="closeErrorButton" type="button"
                        class="w-full inline-flex justify-center rounded-md border border-transparent shadow-sm px-4 py-2 bg-red-600 text-base font-medium text-white hover:bg-red-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500 sm:ml-3 sm:w-auto sm:text-sm">
                        Close
                    </button>

                </div>
            </div>
        </div>
    </div>

    <style>
        input[type='number']::-webkit-inner-spin-button,
        input[type='number']::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .custom-number-input input:focus {
            outline: none !important;
        }

        .custom-number-input button:focus {
            outline: none !important;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

    </style>


    <script>
        function decrement(e) {
            const btn = e.target.parentNode.parentElement.querySelector(
                'button[data-action="decrement"]'
            );
            const target = btn.nextElementSibling;
            let value = Number(target.value);
            value--;
            target.value = value;
        }

        function increment(e) {
            const btn = e.target.parentNode.parentElement.querySelector(
                'button[data-action="decrement"]'
            );
            const target = btn.nextElementSibling;
            let value = Number(target.value);
            value++;
            target.value = value;
        }

        const decrementButtons = document.querySelectorAll(
            `button[data-action="decrement"]`
        );

        const incrementButtons = document.querySelectorAll(
            `button[data-action="increment"]`
        );

        decrementButtons.forEach(btn => {
            btn.addEventListener("click", decrement);
        });

        incrementButtons.forEach(btn => {
            btn.addEventListener("click", increment);
        });
    </script>


    <script>
        // Function to filter items based on name
        function filterItems() {
            var input, filter, items, item, txtValue;
            input = document.getElementById('searchInput');
            filter = input.value.toUpperCase();
            items = document.getElementById('itemsContainer').getElementsByClassName('items-class');

            // Loop through all items and hide those that don't match the search query
            for (var i = 0; i < items.length; i++) {
                item = items[i];
                // txtValue = item.textContent || item.innerText; // this is to hide from getting the text in the description


                itemName = item.querySelector('.item-head').textContent || item.querySelector('.item-head').innerText;
                if (itemName.toUpperCase().indexOf(filter) > -1) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            }
        }

        // Attach event listener to input field
        filterItems()
        document.getElementById('searchInput').addEventListener('input', filterItems);
    </script>


    <script>
        // Simple JavaScript for toggling the menu on small screens
        document.querySelector('nav button').addEventListener('click', function () {
            const links = document.querySelector('nav div.md\\:hidden');
            if (links.classList.contains('hidden')) {
                links.classList.remove('hidden');
            } else {
                links.classList.add('hidden');
            }
        });
    </script>

    <script>
        // Function to show confirmation popup
        function showConfirmation(itemId, itemName, message) {
            var modal = document.getElementById('confirmationModal');
            var deleteMessage = modal.querySelector('.confirmation-text');
            deleteMessage.textContent = message;

            document.getElementById('confirmationModal').classList.remove('hidden');
            document.getElementById('confirmButton').setAttribute('value', itemId);
            document.getElementById('confirmButton').setAttribute('name', itemName);
        }

        function showError() {
            var modal = document.getElementById('errorModal');
            document.getElementById('errorModal').classList.remove('hidden');
        }


        // Function to hide confirmation popup
        function hideConfirmation() {
            document.getElementById('confirmationModal').classList.add('hidden');

        }

        function hideError() {
            document.getElementById('errorModal').classList.add('hidden');

        }

        document.addEventListener('DOMContentLoaded', function () {
            for (let i = 0; i < 20; i++) {
                const inputField = document.getElementById(`item-${i}`);
                const buttonBuy = document.getElementById(`buy-${i}`);
                const buttonSell = document.getElementById(`sell-${i}`);
                // console.log(inputField, `item-${i}`);


                buttonBuy.addEventListener('click', function () {
                    if (inputField.value < 1 && this.value && !/^\d+$/.test(this.value) ) {
                    console.log(inputField.value);
                    showError()
                }
                else{
                    console.log('Value from Button 1:', inputField.value);
                    var itemId = this.getAttribute('value');
                    var itemName = "buy"
                    showConfirmation(itemId, itemName, "Are you sure you want to Buy this Stock?");

                }


                });

                buttonSell.addEventListener('click', function () {
                    if (inputField.value < 1 && this.value && !/^\d+$/.test(this.value) ) {
                    console.log(inputField.value);
                    showError()
                }
                else{
                    console.log('Value from Button 2:', inputField.value);
                    var itemId = this.getAttribute('value');
                    var itemName = "sell"
                    showConfirmation(itemId, itemName, "Are you sure you want to Sell this Stock?");

                }

                });

            }

        });

        // Attach event listener to cancel button
        document.getElementById('cancelButton').addEventListener('click', hideConfirmation);
        document.getElementById('closeErrorButton').addEventListener('click', hideError);

        // Attach event listener to confirm button
        document.getElementById('confirmButton').addEventListener('click', function () {
            console.log("this works")
            var itemId = this.getAttribute('value');
            var itemName = this.getAttribute('name');
            console.log(itemId, itemName)

            // API requests still not configured
            fetch('/delete', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ itemId: itemId }),
            })
                .then(response => {
                    if (response.ok) {
                        // Handle successful response (e.g., update UI)
                        console.log('Item deleted successfully');
                        hideConfirmation();
                    } else {
                        // Handle error response
                        console.error('Error deleting item');
                    }
                })
                .catch(error => {
                    // Handle network error
                    console.error('Network error:', error);
                });
        });


    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.3.0/flowbite.min.js"></script>

</body>

</html>
