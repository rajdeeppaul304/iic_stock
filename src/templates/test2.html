{% extends 'layout.html' %}

{% block content %}
    <script src="{{ url_for('static', filename='js/qrcode.min.js') }}">
    </script>

<div >
  <div>
    <div class="text-3xl font-bold mb-8 text-center pt-5">Your QR code</div>
    <div class="text-2xl font-bold mb-8 text-center pt-5">Ask your friend to scan your code to start trading</div>
  
  
  </div>

  <div class="flex justify-center">
    <div id="qr-code"></div>

  </div>

    <a href="/barter/start_trade" class="flex justify-center w-full p-3 text-2xl underline text-blue-500"> Or, you scan code</a>


  <div>
    <div class="flex justify-center w-full p-3 text-2xl ">Ongoing Trade Requests</div>

  </div>




</div>

<div>
	{% for trade in current_active_trades %}
		<div>
			<div class="inline">
				<!--trade with:	{{ trade[0] }},-->
				<!--you get: {{ trade[1]["stocks_to_get"] }}-->
				{{ trade }}
			</div>

			<form action="barter" class="inline" method="post">
				<input type="hidden" value={{ trade[0] }} name="trader"  />
				<button value="No" name="confirmation" type="submit" style="background-color: red; color: white;">No</button>
				<button value="Yes" name="confirmation" type="submit" style="background-color: green; color: white;">Yes</button>
			</form>
		</div>
	{% endfor %}
</div>


<script>
    let qrCode;
     
    function generateQrCode(qrContent) {
      return new QRCode("qr-code", {
        text: qrContent,
        width: 256,
        height: 256,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H,
      });
    }
     
    // Event listener for form submit event
	generateQrCode({{ current_user }})
</script>
{% endblock %}
