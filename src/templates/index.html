<script>
    function decrement(e) {
        const btn = e.target.parentNode.parentElement.querySelector(
            'button[data-action="decrement"]'
        );
        const target = btn.nextElementSibling;
        let value = Number(target.value);
        // Prevent the value from going below 0
        if (value > 0) {
            value--;
            target.value = value;
        }
    }

    function increment(e) {
        const btn = e.target.parentNode.parentElement.querySelector(
            'button[data-action="decrement"]'
        );
        const target = btn.nextElementSibling;
        let value = Number(target.value);
        value++;
        target.value = value;
    }

    const decrementButtons = document.querySelectorAll(
        `button[data-action="decrement"]`
    );

    const incrementButtons = document.querySelectorAll(
        `button[data-action="increment"]`
    );

    decrementButtons.forEach(btn => {
        btn.addEventListener("click", decrement);
    });

    incrementButtons.forEach(btn => {
        btn.addEventListener("click", increment);
    });
</script>



<script>
    // Function to filter items based on name
    // Function to filter items based on name and sector
    // Function to filter items based on name and sector
    // Keep track of the currently selected sector
    var selectedSector = 'All categories'; // Default to 'All categories'

    // Function to filter items based on name and sector
    function filterItems() {
        var inputName, filterName, items, item, itemName, itemSector;
        inputName = document.getElementById('searchInputName');
        filterName = inputName.value.toUpperCase();

        // Get the selected sector
        var filterSector = selectedSector.toUpperCase();

        items = document.getElementById('itemsContainer').getElementsByClassName('items-class');

        // Loop through all items and hide those that don't match the search queries
        for (var i = 0; i < items.length; i++) {
            item = items[i];
            itemName = item.querySelector('.item-head').textContent || item.querySelector('.item-head').innerText;
            itemSector = item.querySelector('.item-sector').textContent || item.querySelector('.item-sector').innerText;
            // console.log(itemSector)
            // Check if both name and sector match the filters
            if ((itemName.toUpperCase().indexOf(filterName) > -1 || filterName === '') &&
                (itemSector.toUpperCase().indexOf(filterSector) > -1 || filterSector === 'ALL CATEGORIES')) {
                item.style.display = '';
            } else {
                item.style.display = 'none';
            }
        }
    }

    // Attach event listeners to input fields and dropdown options
    document.getElementById('searchInputName').addEventListener('input', filterItems);
    document.getElementById('searchInputName').addEventListener('input', filterItems);

    var dropdownOptions = document.querySelectorAll('#searchInputSector button[name]');
    dropdownOptions.forEach(function (option) {
        option.addEventListener('click', function () {
            // Update the selected sector
            selectedSector = option.getAttribute('name');
            // Update the dropdown button text
            document.getElementById('dropdown-button').textContent = selectedSector;
            // Filter items
            filterItems();
        });
    });
</script>

<script>
    var balance_of_user = document.getElementById("balance-of-user")
    // Function to show confirmation popup
    function showConfirmation(itemId, itemName, number_of_stocks, message) {
        var modal = document.getElementById('confirmationModal');
        var deleteMessage = modal.querySelector('.confirmation-text');
        deleteMessage.textContent = message;
        document.getElementById('confirmationModal').classList.remove('hidden');
        document.getElementById('confirmButton').setAttribute('value', itemId);
        document.getElementById('confirmButton').setAttribute('name', itemName);



    }

    function showError(message) {
        var modal = document.getElementById('errorModal');
        var errorMessage = modal.querySelector('.errorMessage-text');

        modal.classList.remove('hidden');
        modal.classList.add('visible');
        errorMessage.textContent = message;

        document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open

    }

    function showSuccess(message) {
        var modal = document.getElementById('successModal');
        var successMessage = modal.querySelector('.successMessage-text');

        modal.classList.remove('hidden');
        modal.classList.add('visible');
        successMessage.textContent = message;

        document.body.style.overflow = 'hidden'; // Prevent scrolling when modal is open

    }


    // Function to hide confirmation popup
    function hideConfirmation() {
        document.getElementById('confirmationModal').classList.add('hidden');

    }

    function hideError() {
        document.getElementById('errorModal').classList.remove('visible');
        document.getElementById('errorModal').classList.add('hidden');
        document.body.style.overflow = ''; // Restore scrolling when modal is closed
    }

    function hideSuccess() {
        document.getElementById('successModal').classList.remove('visible');
        document.getElementById('successModal').classList.add('hidden');
        document.body.style.overflow = ''; // Restore scrolling when modal is closed
    }

    document.addEventListener('DOMContentLoaded', function () {
        const elements_stock_number = document.querySelectorAll('.input-stock-numbers');



        for (let i = 0; i < elements_stock_number.length; i++) {
            const inputField = elements_stock_number[i];
            const buttonBuy = document.getElementById(`buy-${inputField.name}`);
            const buttonSell = document.getElementById(`sell-${inputField.name}`);
            buttonBuy.addEventListener('click', function () {
                console.log(inputField.value < 1, !inputField.value, !/^\d+$/.test(inputField.value))

                if (inputField.value < 1 || !inputField.value || !/^\d+$/.test(inputField.value)) {
                    console.log(inputField.value);
                    showError("Please enter a valid amount")
                }
                else {
                    console.log(`Value from Button ${inputField.name}:`, inputField.value);
                    var itemId = this.getAttribute('value');
                    var itemName = "buy"
                    showConfirmation(itemId, itemName, inputField.value, `Are you sure you want to Buy ${inputField.value} of this Stock?`);

                }


            });

            buttonSell.addEventListener('click', function () {
                if (inputField.value < 1 || !inputField.value || !/^\d+$/.test(inputField.value)) {
                    console.log(inputField.value);
                    showError("Please enter a valid amount")
                }
                else {
                    console.log(`Value from Button ${inputField.name}:`, inputField.value);
                    var itemId = this.getAttribute('value');
                    var itemName = "sell"
                    showConfirmation(itemId, itemName, inputField.value, `Are you sure you want to Sell ${inputField.value} of this Stock?`);

                }

            });

        }

    });

    // Attach event listener to cancel button
    document.getElementById('cancelButton').addEventListener('click', hideConfirmation);
    document.getElementById('closeErrorButton').addEventListener('click', hideError);
    document.getElementById('closeSuccessButton').addEventListener('click', hideSuccess);

    // Attach event listener to confirm button
    document.getElementById('confirmButton').addEventListener('click', function () {
        console.log("this works")
        var itemId = this.getAttribute('value');
        var itemName = this.getAttribute('name');
        let number_of_stocks = 0
        if (itemName != "FD") {
            number_of_stocks = document.getElementById(`number-stock-${itemId}`)
        }

        const handleResponse = (data) => {
            if (data.success === 1 || data.success === true) {
                console.log(data.message);
                hideConfirmation();
                balance_of_user.innerHTML = `Current Balance: ${data.remaining_balance.toFixed(2)}`;
                if (itemName === "buy") {
                    showSuccess("Successfully Bought The Stock Unit(s).");
                } else if (itemName === "sell") {
                    showSuccess("Successfully Sold The Stock Unit(s).");
                } else if (itemName === "FD") {
                    document.getElementById(`fixed-deposit-currently-owned`).innerHTML = `${data.currentHoldingFD.toFixed(2)}`;

                    showSuccess("Successfully Liquidated The FD.");
                }
            } else {
                console.log(data.message);

                hideConfirmation();
                if (itemName === "buy") {
                    showError("Error: Not enough Balance");
                } else if (itemName === "sell") {
                    showError(`Error: You Do not own ${number_of_stocks.value} stock Units to sell.`);
                } else if (itemName === "FD") {
                    showError(`Error: ${data.message}.`);
                }

            }
        };

        if (itemName === "buy" || itemName === "sell") {
            fetch('/buy_sell_stocks', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ itemId, action: itemName, number_of_stocks: number_of_stocks.value }),
            })
                .then(response => response.json())
                .then(handleResponse)
                .catch(error => {
                    console.error('Error:', error);
                });
        } else if(itemName==="FD"){
            console.log(itemId)
            console.log("itemId")

            fetch('/sell_fd', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ amount:itemId }),
            })
                .then(response => response.json())
                .then(handleResponse)
                .catch(error => {
                    console.error('Error:', error);
                });
        }

    });


</script>
